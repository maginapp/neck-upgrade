name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的 tag，例如 v1.5.7'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "release_tag must start with v: $RELEASE_TAG"
              exit 1
              ;;
          esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package extension
        working-directory: dist
        run: |
          zip -r ../chrome-extension-$RELEASE_TAG.zip . -x '*.DS_Store'

      - name: Prepare release notes
        env:
          CHANGELOG_URL: https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md
        run: |
          release_version="${RELEASE_TAG#v}"
          awk -v version="$release_version" '
            $0 == "## " version { capture = 1; found = 1 }
            capture && $0 ~ /^## / && $0 != "## " version { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ -s RELEASE_NOTES.md ]; then
            printf '\n---\n\n' >> RELEASE_NOTES.md
          else
            echo "No changelog entry found for ${RELEASE_TAG}; using the full changelog link."
          fi
          printf '[View the complete changelog](%s)\n' "$CHANGELOG_URL" >> RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            chrome-extension-${{ env.RELEASE_TAG }}.zip
          body_path: RELEASE_NOTES.md
