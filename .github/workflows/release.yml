name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package extension
        working-directory: dist
        run: |
          zip -r ../chrome-extension-${{ github.ref_name }}.zip . -x '*.DS_Store'

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CHANGELOG_URL: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md
        run: |
          release_version="${RELEASE_TAG#v}"
          awk -v version="$release_version" '
            $0 == "## " version { capture = 1; found = 1 }
            capture && $0 ~ /^## / && $0 != "## " version { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ -s RELEASE_NOTES.md ]; then
            printf '\n---\n\n' >> RELEASE_NOTES.md
          else
            echo "No changelog entry found for ${RELEASE_TAG}; using the full changelog link."
          fi
          printf '[View the complete changelog](%s)\n' "$CHANGELOG_URL" >> RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chrome-extension-${{ github.ref_name }}.zip
          body_path: RELEASE_NOTES.md
